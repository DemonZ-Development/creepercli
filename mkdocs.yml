site_name: CreeperCLI
site_description: Remote administration for Minecraft servers (Java plugin + Node CLI)
site_url: https://demonz-development.github.io/creepercli/
repo_url: https://github.com/DemonZ-Development/creepercli
repo_name: DemonZ-Development/creepercli
edit_uri: edit/main/wiki/

docs_dir: wiki

theme:
  name: material
  palette:
    - scheme: slate
      primary: lime
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: lime
      accent: lime
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.side
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Commands: cli-commands.md
  - Console Commands: console-commands.md
  - Configuration: configuration.md
  - Security: security.md
  - Protocol: protocol.md
  - Plugin API: plugin-api.md
  - Architecture: architecture.md
  - Advanced: advanced.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - tables
  - admonitions
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
