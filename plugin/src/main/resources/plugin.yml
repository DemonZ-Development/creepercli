name: CreeperCLI
version: 1.0.0
main: dev.demonzdevelopment.creepercli.CreeperCLIPlugin
api-version: '1.21'
description: Remote administration TCP plugin with a hardened file sandbox
website: https://github.com/DemonZ-Development/creepercli
commands:
  creepercli:
    description: CreeperCLI administration
    usage: /creepercli <status|reload|user add <name> <password>|user remove <name>|user list>
    permission: creepercli.admin
permissions:
  creepercli.admin:
    description: Manage CreeperCLI users and configuration
    default: op

