name: NPM Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Run tests
        run: npm test
        working-directory: cli

      - name: Verify release version and package
        working-directory: cli
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          npm audit --omit=dev --audit-level=high
          npm pack --dry-run

      - name: Check published version
        id: published
        working-directory: cli
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { name, version } = require('./package.json');
          (async () => {
            const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            if (response.status !== 200 && response.status !== 404) {
              throw new Error(`npm version check failed: HTTP ${response.status}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.status === 200}\n`);
          })().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
