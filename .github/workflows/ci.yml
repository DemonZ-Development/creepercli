name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Build and verify plugin artifact
        run: mvn -B clean verify
        working-directory: plugin

  cli-test:
    strategy:
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Run tests
        run: npm test
        working-directory: cli

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: cli

      - name: Verify publish contents
        run: npm pack --dry-run
        working-directory: cli

      - name: Verify installed CLI command
        working-directory: cli
        run: |
          package_dir=$(mktemp -d)
          npm pack --pack-destination "$package_dir"
          npm install --prefix "$package_dir" "$package_dir/creepercli-$(node -p "require('./package.json').version").tgz" --ignore-scripts --no-audit --no-fund
          "$package_dir/node_modules/.bin/creepercli" --help
